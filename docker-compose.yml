services:
  app:
    image: electronic-queue-php
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queue_app
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - queue_net
    restart: unless-stopped

  bot:
    image: electronic-queue-php
    container_name: queue_bot
    command: ["php", "/var/www/html/bot/poll.php"]
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - queue_net
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: queue_db
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) вместо сокета: во время инициализации временный сервер
      # слушает только сокет, поэтому healthcheck не даст ложного "healthy"
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - queue_net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: queue_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - queue_net
    restart: unless-stopped

networks:
  queue_net:
    driver: bridge

volumes:
  db_data:
