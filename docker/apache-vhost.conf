# Глобальные настройки (убирают предупреждение о FQDN и скрывают версию сервера)
ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    DirectoryIndex index.php index.html

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Приватные директории: закрыты явно (дополнительно к тому,
    # что DocumentRoot указывает только на public/)
    <DirectoryMatch "^/var/www/html/(app|src|config|database|docker|storage|vendor|\.git)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Скрытые файлы (.env, .git, .htpasswd и т.д.)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Служебные и конфигурационные файлы
    <FilesMatch "\.(env|ini|log|sql|bak|md|ya?ml|lock|dist)$">
        Require all denied
    </FilesMatch>

    # Заголовки безопасности (модуль headers включён в Dockerfile)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>